[build]
  command = "node node_modules/vite/bin/vite.js build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Explicit declaration also works if inline config discovery is unavailable.
[[edge_functions]]
  function = "site-access"
  path = "/*"

# DTS_AUTH_PASSWORD must be set in Netlify environment variables, Functions scope.
